version: '3.8'

services:
  # MySQL база данных
  mysql:
    image: mysql:8.0
    container_name: findlybot_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: FindlyBot
      MYSQL_USER: findlybot_user
      MYSQL_PASSWORD: findlybot_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql_init:/docker-entrypoint-initdb.d
    networks:
      - findlybot_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Основной сервис бота
  findlybot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: findlybot_app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - PYTHONPATH=/app/src
    volumes:
      - ./src/findlybot/secret_data:/app/src/findlybot/secret_data
      - ./src/findlybot/local_data:/app/src/findlybot/local_data
      - ./src/findlybot/locales:/app/src/findlybot/locales
      - ./src/findlybot/session.session:/app/src/findlybot/session.session
    networks:
      - findlybot_network
    profiles:
      - production

  # Сервис для разработки
  findlybot_dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: findlybot_dev
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - PYTHONPATH=/app/src
    volumes:
      - ./src:/app/src
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
    networks:
      - findlybot_network
    profiles:
      - development

volumes:
  mysql_data:
    driver: local

networks:
  findlybot_network:
    driver: bridge
