services:
  mysql:
    image: mysql:8.0
    container_name: findlybot_mysql
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql_init:/docker-entrypoint-initdb.d
    networks:
      - findlybot_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 3

  findlybot:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: findlybot_app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/src
    volumes:
      - ./src:/app/src
    networks:
      - findlybot_network
    profiles:
      - production

  findlybot_dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: findlybot_dev
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - WATCHFILES_FORCE_POLLING=true
      - PYTHONPATH=/app/src
    volumes:
      - ./src:/app/src
      - ./locales:/app/locales
    networks:
      - findlybot_network
    profiles:
      - development

volumes:
  mysql_data:
    driver: local

networks:
  findlybot_network:
    driver: bridge
